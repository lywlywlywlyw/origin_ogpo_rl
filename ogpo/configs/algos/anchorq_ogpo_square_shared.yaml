# Same frozen params_90000.pkl, decoder, trainable Value MLP, physical-step budget,
# discount, optimizer and critic update count as dsrl_ogpo_square_shared.yaml.
# Inherit baseline settings directly so changes cannot silently drift apart.
_base_: dsrl_ogpo_square_shared.yaml
experiment:
  run_name: anchorq_square_shared_ogpo_bc_v2
  wandb_name: anchorq_square_shared_ogpo_bc_v2
agent:
  agent_name: anchorq
  anchorq_reference_magnitude: 1.0
  anchorq_reference_gripper: 0.0
  anchorq_include_defer: true
  anchorq_particle_count: 32
  anchorq_particle_sigma: 0.5
  # These schedules are in latent decisions, not physical environment steps.
  anchorq_particle_warmup_decisions: 10000
  anchorq_sigma_ramp_decisions: 0
  anchorq_adaptive_sigma: true
  anchorq_sigma_min: 0.05
  anchorq_sigma_max: 0.3
  anchorq_tilt_beta: 1.0
  anchorq_adaptive_beta: true
  # The paper requires a positive floor without a benchmark table value.
  anchorq_uncertainty_floor: 0.01
  anchorq_epsilon_start: 1.0
  anchorq_epsilon_end: 0.05
  anchorq_epsilon_decay_decisions: 10000
  anchorq_target_aggregation: min
  anchorq_target_heads: 2
  # Appendix B: Q = trainable Value + kappa * frozen independent Value prior.
  anchorq_prior_scale: 2.0
  anchorq_prioritized_replay: true
  # Paper does not tabulate PER exponents: explicit Robomimic choices.
  anchorq_per_alpha: 0.6
  anchorq_per_beta_start: 0.4
  anchorq_per_epsilon: 0.000001
  anchorq_query_batch_size: 256
# Two critic steps per eligible physical step; inherited UTD=1 is a cycle count.
