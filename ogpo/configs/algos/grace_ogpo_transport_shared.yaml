# Inherit the exact matched DSRL run, including its frozen offline checkpoint.
_base_: dsrl_ogpo_transport_shared.yaml
experiment:
  run_name: grace_transport_shared_ogpo_bc
  wandb_name: grace_transport_shared_ogpo_bc
agent:
  agent_name: grace
  # Offline action-Q TD pretraining before online collection (decoder stays frozen).
  pretrain_qnet: false
  increase_num: 2
  # Branch increase_num times after each of the final noise_add_start ODE steps.
  noise_add_start: 2
  # Full shuffled passes over original + augmented transitions.
  pretrain_qnet_epochs: 1
  # SERL-style Dense -> LayerNorm -> activation in the online actor and critics.
  # Uses 10 Qs: min of 2 random Qs for TD backup; mean of all 10 for the actor
  # and latent-Q distillation. Frozen offline decoder architecture is unchanged.
  use_layer_norm: false
  # True: skip encoder tanh; use the LPS sphere for ALL decoder initial latents.
  encoder_sphere_limit: false
  # Replace encoder tanh with hard clip(raw Gaussian, -1, 1).
  # Mutually exclusive with encoder_sphere_limit; entropy uses the raw Gaussian.
  use_encoder_clip: false
  # Independently disable SAC actor entropy and temperature (alpha) loss.
  delete_sac_entropy: false
  gradient_delta_a: null
  gradient_delta_z: null
  gradient_ratio_epsilon: 1.0e-8
  # Bounded Gaussian noise after decoding, for online collection only.
  decoder_add_noise: false
  decoder_noise_std: 0.09
  decoder_noise_clip: 3.0  # Match LPS's bounded-noise branch.
