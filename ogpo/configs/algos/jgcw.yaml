# Independent latent TD critic, with optional action-Q and online diagnostics.
_base_: dsrl.yaml
agent:
  agent_name: jgcw
  inverse_fm_iterations: 16  # safeguarded reconstruction solver iterations
  inverse_fm_radius: 0.5     # maximum L2 distance from the original replay latent
  inverse_fm_batch_size: 32  # fixed inverse microbatch; bounds Jacobian memory
  use_aug_z: false
  aug_z_num: 1
  aug_z_sigma: 0.02
  train_q_sa: false
  cal_q_accuracy: false
  cal_action_coverage: false
